<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Studio-Sinounion</title>
    <style>
      /* Dify chatbot iframe panel */
      #dify-chat-panel {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 24rem;
        height: 40rem;
        max-height: calc(100vh - 40px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        z-index: 9999;
        display: none;
        flex-direction: column;
        overflow: hidden;
      }
      #dify-chat-panel.open {
        display: flex;
      }
      #dify-chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }
      #dify-chat-header button {
        background: none;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        padding: 0 4px;
      }
      #dify-chat-panel iframe {
        flex: 1;
        border: none;
        width: 100%;
      }
      /* Floating toggle button */
      #dify-chat-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #1C64F2;
        color: #fff;
        border: none;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(28,100,242,0.4);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #dify-chat-btn:hover {
        opacity: 0.9;
      }
      #dify-chat-btn.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Dify chatbot toggle button -->
    <button id="dify-chat-btn" onclick="toggleDifyChat()">💬</button>

    <!-- Dify chatbot iframe panel -->
    <div id="dify-chat-panel">
      <div id="dify-chat-header">
        <span>AI 助手</span>
        <button onclick="toggleDifyChat()">✕</button>
      </div>
      <iframe
        id="dify-chat-frame"
        src=""  <!-- 由 JS 动态设置，适配开发和生产环境 -->
        allow="microphone">
      </iframe>
    </div>

    <script>
      // Dify 代理地址：根据运行环境自动选择
      function getDifyProxyUrl() {
        const port = window.location.port;
        // 开发环境：Vite dev server (localhost:5173) + 独立代理服务器 (localhost:5174)
        if (port === '5173' || port === '5174') {
          return `http://${window.location.hostname}:5174`;
        }
        // 生产环境：使用相对路径，由 Nginx 代理转发
        return '';
      }

      // 初始化 iframe src
      document.addEventListener('DOMContentLoaded', function() {
        const proxyUrl = getDifyProxyUrl();
        const frame = document.getElementById('dify-chat-frame');
        frame.src = proxyUrl ? `${proxyUrl}/chat/VBfmK4pPwaPkoX1T` : '/chat/VBfmK4pPwaPkoX1T';
      });

      function toggleDifyChat() {
        var panel = document.getElementById('dify-chat-panel');
        var btn = document.getElementById('dify-chat-btn');
        var isOpen = panel.classList.toggle('open');
        btn.classList.toggle('hidden', isOpen);
      }
    </script>
  </body>
</html>
