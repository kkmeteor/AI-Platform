server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # config.json 禁止缓存，确保配置变更即时生效
    location = /config.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================================
    # Dify 反向代理（生产环境）
    #
    # 注意：Dify 是 Next.js 应用，包含大量绝对路径资源。
    # 如果 Dify 服务器可以配置，推荐直接修改 Dify 的 nginx：
    #   去掉 "X-Frame-Options: DENY" 和 CSP "frame-ancestors"
    # 这样不需要此代理配置，所有资源通过直连 URL 加载即可。
    #
    # 以下代理方案适用于无法修改 Dify 配置的场景。
    # ============================================================

    # Dify Next.js 静态资源
    location /_next/ {
        proxy_pass http://10.10.9.65;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Dify 聊天页面
    location /chat/ {
        proxy_pass http://10.10.9.65;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Dify Chatbot 页面
    location /chatbot/ {
        proxy_pass http://10.10.9.65;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Dify Console 管理页面
    location /console/ {
        proxy_pass http://10.10.9.65;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Dify 文件上传
    location /files/ {
        proxy_pass http://10.10.9.65;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Dify 登录页面
    location /signin {
        proxy_pass http://10.10.9.65;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # ============================================================
    # Dify API 代理（使用正则表达式匹配所有 Dify API 路径）
    # 必须在通用 /api/ 之前定义，优先级更高
    # 
    # 匹配的 API 路径包括：
    # - /api/webapp/*       - WebApp 相关 API
    # - /api/site           - 站点信息
    # - /api/parameters     - 参数配置
    # - /api/login/*        - 登录相关
    # - /api/conversations  - 会话管理
    # - /api/passport       - 护照认证
    # - /api/logout         - 登出
    # - /api/meta           - 元数据
    # - /api/messages       - 会话消息历史
    # - /api/chat-messages  - 聊天消息
    # ============================================================
    location ~ ^/api/(webapp|site|parameters|login|conversations|passport|logout|meta|chat-messages|messages) {
        proxy_pass http://10.10.9.65;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # 反向代理后端 API（匹配所有其他 /api/ 路径）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持大文件上传
        client_max_body_size 100M;
    }

}
