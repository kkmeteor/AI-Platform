# ============================================
# DCloud Market - Docker Compose (Registry Deploy)
# Pull images from internal registry at runtime
# ============================================
# Usage:
#   Start:   docker-compose -f docker-compose.registry.yml up -d
#   Stop:    docker-compose -f docker-compose.registry.yml down
#   Logs:    docker-compose -f docker-compose.registry.yml logs -f
# ============================================

version: "3.8"

services:
  # ------------------------------------------
  # Backend - FastAPI (Python)
  # ------------------------------------------
  backend:
    image: ${REGISTRY:-10.10.11.194:1000}/dcloud-market-backend:latest
    pull_policy: always
    container_name: dcloud-market-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist data to host C:\Data directory
      - C:/Data/skills.db:/app/data/skills.db
      - C:/Data/uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/skills.db
    networks:
      - dcloud-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------
  # Frontend - Nginx (React SPA)
  # ------------------------------------------
  frontend:
    image: ${REGISTRY:-10.10.11.194:1000}/dcloud-market-frontend:latest
    pull_policy: always
    container_name: dcloud-market-frontend
    restart: unless-stopped
    ports:
      - "9090:80"
    environment:
      # Dify service URL, change this to switch environments without rebuilding
      - DIFY_URL=http://10.10.9.65:80
    volumes:
      # Mount config file for runtime override (no rebuild needed)
      - ./config/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dcloud-network

# ------------------------------------------
# Network
# ------------------------------------------
networks:
  dcloud-network:
    driver: bridge
    name: dcloud-market-network
