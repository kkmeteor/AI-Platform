<nz-modal
  [nzVisible]="visible"
  nzTitle="上传 Skill"
  [nzOkLoading]="loading"
  nzOkText="上传"
  nzCancelText="取消"
  (nzOnOk)="handleOk()"
  (nzOnCancel)="handleCancel()"
>
  <form nz-form nzLayout="vertical" [formGroup]="form" style="margin-top: 16px;">
    <nz-form-item>
      <nz-form-label nzFor="name" nzRequired>名称</nz-form-label>
      <nz-form-control nzErrorTip="请输入 Skill 名称">
        <input nz-input formControlName="name" placeholder="输入 Skill 名称" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzFor="description">描述</nz-form-label>
      <nz-form-control>
        <textarea nz-input formControlName="description" [nzAutosize]="{ minRows: 3 }" placeholder="输入描述"></textarea>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzFor="author">作者</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="author" placeholder="输入作者名称" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzFor="version">版本</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="version" placeholder="例如: 1.0.0" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzFor="tags">标签</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="tags" placeholder="用逗号分隔，例如: tool,ai,helper" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired>文件</nz-form-label>
      <nz-form-control>
        <nz-upload
          nzType="drag"
          [nzAccept]="'.zip'"
          [nzLimit]="1"
          [(nzFileList)]="fileList"
          [nzBeforeUpload]="beforeUpload"
        >
          <p class="ant-upload-drag-icon">
            <span nz-icon nzType="inbox"></span>
          </p>
          <p class="ant-upload-text">点击或拖拽 .zip 文件到此处上传</p>
        </nz-upload>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-modal>
